<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSL Lift Addition Project</title>
  <style>
    :root {
      /* 調整為較明亮亮紅褐色系 (Lightened Red-Brown Palette) */
      --bg-color: #3d2319;         /* 整體背景：明亮深紅褐 */
      --card-bg: #523124;        /* 卡片背景：中紅褐色 */
      --card-border: #7a4936;    /* 卡片與邊框：淺紅褐 */
      --text-main: #ffffff;      /* 主文字：純白 */
      --text-sub: #e2cecb;       /* 次要文字：柔和淺粉白 */
      
      /* 月份狀態顏色 */
      --status-past: #4ade80;    /* 已過去：亮綠色 */
      --status-current: #fb923c; /* 當前月份：亮橘色 */
      --status-future: #e2cecb;  /* 未到月份：淡粉褐色 */
      
      --accent-red-brown: #f97316;/* 亮橙紅點綴色 */
      --meeting-badge-bg: #9a3412;/* 會議日期標籤背景色 */
      --timeline-height: 105px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* 頂部時間線區域 - 容器 */
    .timeline-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: var(--timeline-height);
      background-color: rgba(82, 49, 36, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      z-index: 1000;
      display: flex;
      align-items: center;
      padding: 0 !important;
      margin: 0 !important;
      overflow-x: auto;
      scroll-behavior: smooth;
      
      scrollbar-width: thin;
      scrollbar-color: var(--card-border) transparent;
    }

    .timeline-header::-webkit-scrollbar {
      height: 6px;
    }
    .timeline-header::-webkit-scrollbar-track {
      background: transparent;
    }
    .timeline-header::-webkit-scrollbar-thumb {
      background-color: var(--card-border);
      border-radius: 4px;
    }

    /* 時間線軌道 */
    .timeline-track {
      display: flex;
      align-items: center;
      position: relative;
      padding: 10px 0 !important;
      margin: 0 !important;
      min-width: 100vw;
      width: max-content;
    }

    /* 直線貫穿整個頁面 */
    .timeline-line {
      position: absolute;
      top: 24px;
      left: 0;
      right: 0;
      width: 100%;
      height: 3px;
      background-color: var(--card-border);
      z-index: 1;
    }

    /* 時間點按鈕 */
    .timeline-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
      z-index: 2;
      background: none;
      border: none;
      outline: none;
      transition: transform 0.2s ease;
      padding: 0 4px;
      margin: 0;
      
      flex: 0 0 110px;
      min-width: 110px;
    }

    .timeline-node .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 3px solid var(--card-bg);
      margin-bottom: 8px;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }

    .timeline-node .date {
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 2px;
      white-space: nowrap;
    }

    .timeline-node .label {
      font-size: 0.72rem;
      white-space: nowrap;
      width: 100%;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 月份狀態顏色標示 */
    .timeline-node.is-past .dot {
      background-color: var(--status-past);
      box-shadow: 0 0 6px rgba(74, 222, 128, 0.4);
    }
    .timeline-node.is-past .date,
    .timeline-node.is-past .label {
      color: #86efac;
    }

    .timeline-node.is-current .dot {
      background-color: var(--status-current);
      animation: pulse-dot 2.5s infinite ease-in-out;
    }
    .timeline-node.is-current .date,
    .timeline-node.is-current .label {
      color: #ffedd5;
      font-weight: bold;
    }

    @keyframes pulse-dot {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(251, 146, 60, 0.8);
      }
      50% {
        transform: scale(1.3);
        box-shadow: 0 0 12px 6px rgba(251, 146, 60, 0.3);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(251, 146, 60, 0);
      }
    }

    .timeline-node.is-future .dot {
      background-color: var(--status-future);
    }
    .timeline-node.is-future .date,
    .timeline-node.is-future .label {
      color: var(--status-future);
      opacity: 0.85;
    }

    .timeline-node:hover {
      transform: translateY(-2px);
    }

    .timeline-node.active .dot {
      outline: 2px solid var(--text-main);
      outline-offset: 2px;
    }
    .timeline-node.active .date {
      text-decoration: underline;
      font-size: 0.85rem;
    }

    /* 主內容區塊 */
    .content-container {
      margin-top: var(--timeline-height);
      padding: 30px 40px;
      max-width: 1600px;
      margin-left: auto;
      margin-right: auto;
    }

    .milestone-section {
      min-height: calc(100vh - var(--timeline-height) - 60px);
      display: flex;
      align-items: center;
      padding: 20px 0;
      scroll-margin-top: var(--timeline-height);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 100%;
      aspect-ratio: 16 / 8.8;
      max-height: 78vh;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
    }

    /* 左側多圖片展示區 */
    .card-gallery-wrapper {
      background-color: #2f1b13;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
      overflow: hidden;
      border-right: 1px solid var(--card-border);
    }

    .gallery-header {
      font-size: 0.85rem;
      color: var(--text-sub);
      display: flex;
      justify-content: flex-end;
      padding-bottom: 4px;
      border-bottom: 1px solid #633a2b;
      flex-shrink: 0;
    }

    .image-grid {
      display: grid;
      gap: 12px;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .image-grid.count-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .image-grid.count-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    .image-grid.count-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .image-grid.count-3 .img-item:first-child { grid-column: span 2; }
    .image-grid.count-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

    .img-item {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .img-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .img-item:hover img {
      transform: scale(1.03);
    }

    .img-placeholder-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #523124 0%, #2f1b13 100%);
      color: var(--text-sub);
      padding: 15px;
      text-align: center;
      font-size: 0.85rem;
    }
    .img-placeholder-fallback span {
      font-family: monospace;
      color: var(--accent-red-brown);
      margin-top: 6px;
      font-size: 0.75rem;
    }

    /* 右側詳細內容區 */
    .card-info {
      padding: 35px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
      position: relative;
    }

    .card-header {
      margin-bottom: 20px;
    }

    .badge-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .date-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .date-badge.is-past { background-color: rgba(74, 222, 128, 0.2); color: #86efac; border: 1px solid #4ade80; }
    .date-badge.is-current { background-color: rgba(251, 146, 60, 0.25); color: #ffedd5; border: 1px solid #fb923c; }
    .date-badge.is-future { background-color: rgba(226, 206, 203, 0.15); color: #ffffff; border: 1px solid #a36f5c; }

    .meeting-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      background-color: var(--meeting-badge-bg);
      color: #ffedd5;
      border: 1px solid var(--accent-red-brown);
    }

    .card-header h2 {
      font-size: 1.8rem;
      color: var(--text-main);
      line-height: 1.3;
    }

    .card-body {
      margin-bottom: auto;
    }

    .task-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .task-list {
      list-style: none;
    }

    .task-list li {
      color: var(--text-main);
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 0.98rem;
      line-height: 1.5;
    }

    .task-list li::before {
      content: "■";
      color: var(--accent-red-brown);
      font-size: 0.7rem;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .card-footer {
      border-top: 1px solid var(--card-border);
      padding-top: 16px;
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      color: var(--text-sub);
      font-size: 0.85rem;
    }

    /* 右下方超大字體月份樣式 (原 1.8rem 放大 3 倍至 5.4rem) */
    .card-footer .month-display {
      font-size: 5.4rem;
      font-weight: 800;
      color: var(--text-sub);
      letter-spacing: 1px;
      line-height: 0.85;
      opacity: 0.35;
      user-select: none;
    }

    @media (max-width: 1100px) {
      .card {
        grid-template-columns: 1fr;
        aspect-ratio: auto;
        max-height: none;
      }
      .card-gallery-wrapper {
        border-right: none;
        border-bottom: 1px solid var(--card-border);
        height: 380px;
      }
    }
  </style>
</head>
<body>

  <!-- 頂部時間線區域 -->
  <header class="timeline-header" id="timelineHeader">
    <div class="timeline-track" id="timelineTrack">
      <div class="timeline-line" id="timelineLine"></div>
    </div>
  </header>

  <!-- 下方詳細內容區 -->
  <main class="content-container" id="contentContainer"></main>

  <script>
    const milestones = [
      { 
        date: "2025.11", 
        title: "草坪原貌", 
        tasks: [
          "現場原貌拍攝存檔"
        ], 
        images: ["img/202511-01.jpg"] 
      },
      { 
        date: "2025.12", 
        title: "進場", 
        tasks: [
          "工程告示牌設立",
          "臨時水電接駁"
        ], 
        images: ["img/202512-01.jpg"] 
      },
      { 
        date: "2026.01", 
        title: "掘地", 
        meetingDate: "9/1",
        tasks: [
          "地表開挖",
          "場地整理"
        ], 
        images: ["img/202601-01.jpg"] 
      },
      { 
        date: "2026.02", 
        title: "地下電纜改位", 
        meetingDate: "9/2",
        tasks: [
          "地下電纜臨時放置 W 座 G/F 走廊天花"
        ], 
        images: ["img/202602-01.jpg"] 
      },
      { 
        date: "2026.03", 
        title: "安裝圍街板", 
        meetingDate: "9/3",
        tasks: [
          "安裝圍街板",
          "地下管道改位 (W座 G/F)"
        ], 
        images: [
          "img/202603-01.jpg",
          "img/202603-02.jpg",
          "img/202603-03.jpeg"
        ] 
      },
      { 
        date: "2026.04", 
        title: "打閘板", 
        meetingDate: "13/4",
        tasks: [
          "打閘板"
        ], 
        images: [
          "img/202604-01.jpg",
          "img/202604-02.jpeg",
          "img/202604-03.jpg"
        ] 
      },
      { 
        date: "2026.05", 
        title: "打閘板", 
        meetingDate: "18/5",
        tasks: [
          "安裝隔音布",
          "教員室洗手盤恢復使用"
        ], 
        images: [
          "img/202605-01.jpeg",
          "img/202605-02.jpg"
        ] 
      },
      { 
        date: "2026.06", 
        title: "打閘板", 
        meetingDate: "15/6",
        tasks: [
          "打閘板",
          "地下管道改位"
        ], 
        images: ["img/202606-01.jpeg"] 
      },
      { 
        date: "2026.07", 
        title: "打閘板、灌漿", 
        meetingDate: "13/7",
        tasks: [
          "10/7 臨時消防喉接駁完成",
          "23/7 閘板機離場 & 灌漿機進場",
          "W座 G/F 地台復原 (稍後需重做)",
          "W座 G/F 職員洗手間外喉管改位"
        ], 
        images: [
          "img/202607-01.jpeg",
          "img/202607-02.jpeg",
          "img/202607-03.jpeg",
          "img/202607-04.jpeg"
        ] 
      },
      { 
        date: "2026.08", 
        title: "灌漿", 
        tasks: [
          "W座 G/F 職員洗手間外喉管改位 & 地台復原",
          "15/8 灌漿完成 (18/18)",
          "機械運走",
          "安裝圍街板 (G/F, 4-6/F)"
        ], 
        images: [
          "img/202608-01.jpeg",
          "img/202608-02.jpeg",
          "img/202608-03.jpeg"
        ] 
      },
      { 
        date: "2026.09", 
        title: "打樁", 
        meetingDate: "14/9",
        tasks: [
          "試樁",
          "打樁 (共 6 支)"
        ], 
        images: [] 
      },
      { 
        date: "2026.12", 
        title: "建造斜台", 
        tasks: ["斜台鋼骨結構組裝", "混凝土階梯與坡道澆置", "扶手預埋件設置"], 
        images: [] 
      },
      { 
        date: "2027.02", 
        title: "升降機大樓落成", 
        tasks: ["塔樓結構封頂", "外牆防水與幕牆施工", "機房防雨與通風設施"], 
        images: [] 
      },
      { 
        date: "2027.03", 
        title: "安裝升降機", 
        tasks: ["主機與導軌精準校準", "機廂與鋼纜吊裝", "控制櫃佈線與調校"], 
        images: [] 
      },
      { 
        date: "2027.07", 
        title: "竣工", 
        tasks: [
          "現場環境清潔與復原",
          "發出升降機准用證",
          "升降機啟用"
        ], 
        images: ["img/202707-01.jpg"] 
      }
    ];

    const CURRENT_YM = "2026.08"; 

    function getMonthStatus(dateStr) {
      if (dateStr < CURRENT_YM) return "past";
      if (dateStr === CURRENT_YM) return "current";
      return "future";
    }

    const timelineTrack = document.getElementById("timelineTrack");
    const contentContainer = document.getElementById("contentContainer");
    let isProgrammaticScroll = false;
    let currentTargetNode = null;
    let currentTargetSectionId = null;

    milestones.forEach((item, index) => {
      const id = `milestone-${index}`;
      const status = getMonthStatus(item.date);

      const node = document.createElement("button");
      node.className = `timeline-node is-${status}`;
      node.dataset.target = id;
      
      const statusText = status === 'past' ? '已完成' : (status === 'current' ? '進行中' : '未到');

      node.innerHTML = `
        <div class="dot" title="${statusText}"></div>
        <div class="date">${item.date}</div>
        <div class="label" title="${item.title}">${item.title}</div>
      `;
      node.addEventListener("click", () => handleNodeClick(id, node));
      timelineTrack.appendChild(node);

      if (status === 'current') {
        currentTargetNode = node;
        currentTargetSectionId = id;
      }

      const imgCount = item.images.length;
      const galleryHtml = imgCount > 0 ? item.images.map((src, i) => `
        <div class="img-item">
          <img src="${src}" alt="${item.title} 圖片 ${i+1}" 
               onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'img-placeholder-fallback\\'>📷 圖片載入失敗<br><span>${src}</span></div>';">
        </div>
      `).join('') : `<div class="img-placeholder-fallback">📷 暫無圖片紀錄</div>`;

      const meetingBadgeHtml = item.meetingDate 
        ? `<span class="meeting-badge">📅 會議日期: ${item.meetingDate}</span>` 
        : '';

      const section = document.createElement("section");
      section.className = "milestone-section";
      section.id = id;
      section.innerHTML = `
        <div class="card">
          <div class="card-gallery-wrapper">
            <div class="gallery-header">
              <span>共 ${imgCount} 張圖片</span>
            </div>
            <div class="image-grid count-${Math.min(imgCount || 1, 4)}">
              ${galleryHtml}
            </div>
          </div>
          <div class="card-info">
            <div class="card-header">
              <div class="badge-group">
                <span class="date-badge is-${status}">
                  ${status === 'past' ? '已完成工序' : (status === 'current' ? '本月施工項目 (進行中)' : '規劃中工序')}
                </span>
                ${meetingBadgeHtml}
              </div>
              <h2>${item.title}</h2>
            </div>
            <div class="card-body">
              <div class="task-title">重點工序項目：</div>
              <ul class="task-list">
                ${item.tasks.map(t => `<li>${t}</li>`).join('')}
              </ul>
            </div>
            <div class="card-footer">
              <span>狀態: ${status === 'past' ? '✓ 已完成' : (status === 'current' ? '⚡ 施工中' : '⏳ 待展開')}</span>
              <span class="month-display">${item.date}</span>
            </div>
          </div>
        </div>
      `;
      contentContainer.appendChild(section);
    });

    function handleNodeClick(targetId, targetNode) {
      isProgrammaticScroll = true;
      setActiveNode(targetNode);

      const targetElement = document.getElementById(targetId);
      targetElement.scrollIntoView({ behavior: "smooth" });

      setTimeout(() => {
        isProgrammaticScroll = false;
      }, 800);
    }

    function setActiveNode(node) {
      document.querySelectorAll(".timeline-node").forEach(n => n.classList.remove("active"));
      node.classList.add("active");
      node.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
    }

    const observerOptions = {
      root: null,
      rootMargin: "-30% 0px -40% 0px",
      threshold: 0.1
    };

    const observer = new IntersectionObserver((entries) => {
      if (isProgrammaticScroll) return;

      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const targetId = entry.target.id;
          const correspondingNode = document.querySelector(`.timeline-node[data-target="${targetId}"]`);
          if (correspondingNode) {
            setActiveNode(correspondingNode);
          }
        }
      });
    }, observerOptions);

    document.querySelectorAll(".milestone-section").forEach(section => {
      observer.observe(section);
    });

    function fixLineWidth() {
      const track = document.getElementById("timelineTrack");
      const line = document.getElementById("timelineLine");
      if (track && line) {
        line.style.width = Math.max(track.scrollWidth, window.innerWidth) + "px";
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      fixLineWidth();
      setTimeout(() => {
        fixLineWidth();
        if (currentTargetNode && currentTargetSectionId) {
          handleNodeClick(currentTargetSectionId, currentTargetNode);
        } else {
          const firstNode = document.querySelector(".timeline-node");
          if (firstNode) handleNodeClick("milestone-0", firstNode);
        }
      }, 100);
    });

    window.addEventListener("resize", fixLineWidth);
  </script>
</body>
</html>
